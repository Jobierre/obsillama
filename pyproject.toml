[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsillama"
version = "0.1.0"
description = "Système d'organisation intelligente de notes Obsidian avec GraphRAG et Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jobierre", email = "jobierre@example.com"}
]
keywords = ["obsidian", "note-taking", "ai", "graphrag", "ollama", "categorization", "knowledge-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "graphrag>=2.7.0",
    "lancedb>=0.15.0",
    "ollama>=0.4.2",
    "click>=8.1.7",
    "rich>=13.7.1",
    "textual>=0.85.0",
    "ruamel.yaml>=0.18.6",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.9.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "igraph>=0.11.8",
    "langchain>=0.3.15",
    "tenacity>=9.0.0",
    "tqdm>=4.67.1",
    "chardet>=5.2.0",
    "pathlib2>=2.3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "flake8>=7.1.1",
    "mypy>=1.13.0",
]

[project.scripts]
obsillama = "obsillama.__main__:main"

[project.urls]
Homepage = "https://github.com/jobierre/obsillama"
Repository = "https://github.com/jobierre/obsillama"
Issues = "https://github.com/jobierre/obsillama/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["obsillama*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    "data",
]
